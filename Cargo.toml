[package]
name = "stickman"
version = "0.1.0"
edition = "2021"
description = "A procedurally animated stickman that lives on your desktop"

[dependencies]
tiny-skia = "0.11"

[build-dependencies]
embed-manifest = "1.4"

[target.'cfg(windows)'.dependencies]
# Only for UI Automation (COM): reading the taskbar's buttons.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
